# =============================================================================
#  Reverse proxy — production.
#
#  Terminates TLS, serves Next.js at / and FastAPI at /api/v1. In development
#  Next's own rewrite does this job and nginx is not in the stack at all; this
#  file exists so that the production topology matches it exactly, which is
#  what keeps the refresh cookie SameSite=Lax in both.
# =============================================================================

upstream ulpin_web { server web:3000; keepalive 32; }
upstream ulpin_api { server api:8000; keepalive 32; }

# Login is the expensive endpoint (Argon2id is deliberately slow) and the one
# worth guessing against, so it gets its own bucket.
limit_req_zone $binary_remote_addr zone=ulpin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ulpin_api:10m   rate=120r/m;

server {
    listen 80;
    server_name _;
    # ACME lives here; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    # Deed scans and geometry uploads. 10 MB is the default and too small.
    client_max_body_size 25m;

    # --- API -----------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=ulpin_login burst=5 nodelay;
        proxy_pass http://ulpin_api;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    location /api/v1/ {
        limit_req zone=ulpin_api burst=40 nodelay;
        proxy_pass http://ulpin_api;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # --- Frontend ------------------------------------------------------------
    # Next fingerprints everything under /_next/static, so it is immutable.
    location /_next/static/ {
        proxy_pass http://ulpin_web;
        include /etc/nginx/conf.d/proxy-params.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ulpin_web;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
}
